# Overlay for the chaos suite: swap the real provider for one that can be told
# to fail, and shorten the settlement window so a sweep is observable inside a
# run rather than five minutes after it.
#
#   docker compose -f docker-compose.yml -f docker-compose.chaos.yml up -d
#
# Never use this overlay for anything but the suite — it points the gateway at a
# fake upstream, so numbers gathered under it are synthetic by construction.

services:
  provider:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: uvicorn chaos.provider:app --host 0.0.0.0 --port 9000
    environment:
      # Substituted from the shell so a scenario can inject a fault with
      # `CHAOS_USAGE_SKEW=4 docker compose up -d provider`. Hardcoding these
      # would silently override the scenario and the fault would never fire.
      CHAOS_CHUNKS: "${CHAOS_CHUNKS:-40}"
      CHAOS_CHUNK_DELAY_MS: "${CHAOS_CHUNK_DELAY_MS:-8}"
      CHAOS_TRUNCATE_RATE: "${CHAOS_TRUNCATE_RATE:-0}"
      CHAOS_USAGE_SKEW: "${CHAOS_USAGE_SKEW:-0}"
      CHAOS_NO_USAGE_RATE: "${CHAOS_NO_USAGE_RATE:-0}"
    expose:
      - "9000"

  gateway:
    environment:
      PROVIDER_BASE_URL: http://provider:9000
      PROVIDER_API_KEY: chaos-not-a-real-key
      SETTLEMENT_WINDOW_SECONDS: "30"
      # Large enough that budgets never fire unless a scenario wants them to.
      TENANT_BUDGET_TOKENS: "100000000"
    depends_on:
      provider: {condition: service_started}

  reconciler:
    environment:
      SETTLEMENT_WINDOW_SECONDS: "30"
