name: inference-ledger

services:
  redpanda:
    image: redpandadata/redpanda:v24.3.1
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      retries: 20

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - ./src/inference_ledger/ledger/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: uvicorn inference_ledger.gateway.app:app --host 0.0.0.0 --port 8080
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: redpanda:29092
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgresql://ledger:ledger@postgres:5432/ledger
    ports:
      - "8080:8080"
    # Must exceed the longest expected stream so in-flight requests can settle
    # before the container is killed. See docs/shutdown.md.
    stop_grace_period: 45s
    depends_on:
      redpanda: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  reconciler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python -m inference_ledger.reconciler
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: redpanda:29092
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgresql://ledger:ledger@postgres:5432/ledger
    depends_on:
      redpanda: {condition: service_healthy}
      postgres: {condition: service_healthy}

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./deploy/grafana:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
