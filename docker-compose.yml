name: inference-ledger

services:
  redpanda:
    image: redpandadata/redpanda:v24.3.1
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:19092
      # Without an explicit cap Redpanda claims most of the host's RAM on start.
      - --memory 1G
      - --reserve-memory 0M
    ports:
      # Loopback-only: the broker is infrastructure, not a public surface.
      - "127.0.0.1:19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      retries: 20

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "127.0.0.1:5432:5432"
    # No schema mount: the reconciler applies schema.sql itself on startup
    # (idempotent, and the only approach that also works against managed RDS).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: uvicorn inference_ledger.gateway.app:app --host 0.0.0.0 --port 8080
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: redpanda:29092
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgresql://ledger:ledger@postgres:5432/ledger
    ports:
      # The gateway proxies to a paid provider using a server-held API key.
      # It must never be exposed to an untrusted network — bind loopback and
      # reach it over an SSH tunnel. See docs/deployment.md.
      - "127.0.0.1:8080:8080"
    # Must exceed the longest expected stream so in-flight requests can settle
    # before the container is killed. See docs/shutdown.md.
    stop_grace_period: 45s
    depends_on:
      redpanda: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  reconciler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python -m inference_ledger.reconciler
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: redpanda:29092
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgresql://ledger:ledger@postgres:5432/ledger
    expose:
      - "9100"  # Prometheus metrics, scraped in-network; not published to host
    depends_on:
      redpanda: {condition: service_healthy}
      postgres: {condition: service_healthy}

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      # Read-only anonymous access so the dashboard opens without a login,
      # without handing an admin console to anyone who reaches the port.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./deploy/grafana:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
