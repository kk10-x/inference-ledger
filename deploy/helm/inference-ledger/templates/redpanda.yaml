{{- if .Values.redpanda.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redpanda
  labels:
    {{- include "il.labels" . | nindent 4 }}
    app.kubernetes.io/component: redpanda
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "il.selector" . | nindent 6 }}
      app.kubernetes.io/component: redpanda
  template:
    metadata:
      labels:
        {{- include "il.selector" . | nindent 8 }}
        app.kubernetes.io/component: redpanda
    spec:
      containers:
        - name: redpanda
          image: {{ .Values.redpanda.image }}
          args:
            - redpanda start
            - --smp 1
            - --overprovisioned
            - --node-id 0
            - --memory {{ .Values.redpanda.memory }}
            - --reserve-memory 0M
            # Advertise the Service DNS name, or clients resolve a pod IP that
            # dies on reschedule.
            - --kafka-addr PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr PLAINTEXT://{{ .Release.Name }}-redpanda:9092
          ports:
            - {name: kafka, containerPort: 9092}
          readinessProbe:
            exec:
              command: ["sh", "-c", "rpk cluster health | grep -q 'Healthy:.*true'"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - {name: data, mountPath: /var/lib/redpanda/data}
          resources:
            {{- toYaml .Values.redpanda.resources | nindent 12 }}
      volumes:
        # emptyDir is fine for a demo/kind cluster; use a PVC for anything you
        # want to survive a pod restart.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redpanda
  labels:
    {{- include "il.labels" . | nindent 4 }}
    app.kubernetes.io/component: redpanda
spec:
  selector:
    {{- include "il.selector" . | nindent 4 }}
    app.kubernetes.io/component: redpanda
  ports:
    - {name: kafka, port: 9092, targetPort: kafka}
{{- end }}
