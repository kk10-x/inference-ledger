{{- if .Values.chaosProvider.enabled }}
# Dev-only in-cluster mock upstream — the same fake provider the chaos suite
# uses. It lets the whole pipeline run on kind with no real API key and no spend.
# Never enable this in a real deployment; the gateway would proxy to a fake.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-chaos-provider
  labels:
    {{- include "il.labels" . | nindent 4 }}
    app.kubernetes.io/component: chaos-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "il.selector" . | nindent 6 }}
      app.kubernetes.io/component: chaos-provider
  template:
    metadata:
      labels:
        {{- include "il.selector" . | nindent 8 }}
        app.kubernetes.io/component: chaos-provider
    spec:
      containers:
        - name: chaos-provider
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "chaos.provider:app", "--host=0.0.0.0", "--port=9000"]
          env:
            - {name: CHAOS_USAGE_SKEW, value: {{ .Values.chaosProvider.usageSkew | quote }}}
            - {name: CHAOS_NO_USAGE_RATE, value: {{ .Values.chaosProvider.noUsageRate | quote }}}
          ports:
            - {name: http, containerPort: 9000}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-chaos-provider
  labels:
    {{- include "il.labels" . | nindent 4 }}
    app.kubernetes.io/component: chaos-provider
spec:
  selector:
    {{- include "il.selector" . | nindent 4 }}
    app.kubernetes.io/component: chaos-provider
  ports:
    - {name: http, port: 9000, targetPort: http}
{{- end }}
