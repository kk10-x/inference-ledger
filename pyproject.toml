[project]
name = "inference-ledger"
version = "0.1.0"
description = "OpenAI-compatible inference gateway with exactly-once token accounting and a Kafka reconciliation loop"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# "." is required for the `chaos` package: `python -m pytest` injects the cwd
# into sys.path but a bare `pytest` does not, so omitting it passes locally and
# fails in CI. "tests" is for conftest helpers imported directly by test modules.
pythonpath = [".", "src", "tests"]
